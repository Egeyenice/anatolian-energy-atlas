name: Daily energy data

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 07:17 Türkiye time (04:17 UTC)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Optional start date (YYYY-MM-DD) to fetch every day up to yesterday"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data from EPİAŞ
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python scripts/fetch_epias.py --backfill "${{ github.event.inputs.backfill }}"
          else
            python scripts/fetch_epias.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "energy-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/daily
          git diff --staged --quiet || git commit -m "Update daily energy data"
          git push
