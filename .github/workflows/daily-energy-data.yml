name: Daily energy data

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 07:17 Türkiye time (04:17 UTC)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Optional start date (YYYY-MM-DD) to fetch every day up to yesterday"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data from EPİAŞ
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python -u scripts/fetch_epias.py --backfill "${{ github.event.inputs.backfill }}"
          else
            python -u scripts/fetch_epias.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "energy-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/daily
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update daily energy data"
          # Other commits (e.g. from Lovable) may have landed while the data was
          # being fetched, so bring them in first and retry a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying in 15 seconds..."
            sleep 15
          done
          echo "Could not push after 5 attempts."
          exit 1

      - name: Keep the daily schedule switched on
        # GitHub switches off scheduled workflows in public repositories after
        # 60 days without activity. Re-enabling it on every run resets that timer.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-energy-data.yml/enable" || echo "Could not refresh the schedule (not critical)."
